<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content is the modern, WebView-level
         mechanism (Chrome/WebView 108+) that actually governs whether the
         CSS viewport (height:100%, 100vh, etc.) shrinks when the on-screen
         keyboard opens — independent of, and often overriding, whatever
         android:windowSoftInputMode says at the native Activity level.
         Without it, WebView's default (resizes-visual) leaves the CSS
         layout viewport at full height while only a separate "visual
         viewport" shrinks, which is exactly the kind of mismatch that
         produces a keyboard-open screen that looks blank/frozen even
         though the DOM underneath is still correct. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1F6FEB" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>WMS App</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Maximally-compatible plain-ES5 safety net: if the module bundle below
      fails to parse or throws before React ever mounts (e.g. on an older
      WebView), this still runs and shows something readable instead of a
      silent blank screen. window.__appBooted is set by src/main.jsx once
      React actually starts rendering (see components/ErrorBoundary.jsx for
      the in-React equivalent, which covers crashes after that point).
    -->
    <script>
      // The interactive-widget meta tag above only helps if this specific
      // device's WebView build actually honors it — some builds silently
      // ignore hints they don't recognize, which would explain why the
      // meta tag alone didn't fix the blank-screen-while-typing bug. This
      // is a stronger, WebView-version-independent version of the same
      // idea: instead of asking the WebView to resize the CSS layout
      // viewport declaratively, we measure the real visible area
      // ourselves (window.visualViewport, which reflects the keyboard
      // reliably even on WebView builds that don't support the meta hint)
      // and force <html>'s height to that exact pixel value on every
      // change. Since index.css defines html/body/#root as height: 100%,
      // this directly and forcibly reflows the whole page every time the
      // keyboard opens/closes/changes height, rather than relying on the
      // browser to notice on its own — which is what should make the
      // screen behind the keyboard actually repaint instead of staying
      // blank/stale.
      (function () {
        function applyViewportHeight() {
          var vv = window.visualViewport;
          var h = vv ? vv.height : window.innerHeight;
          document.documentElement.style.height = h + 'px';
        }
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', applyViewportHeight);
          window.visualViewport.addEventListener('scroll', applyViewportHeight);
        }
        window.addEventListener('resize', applyViewportHeight);
        applyViewportHeight();
      })();
      window.__bootDiag = { errors: [] };
      window.addEventListener('error', function (e) {
        window.__bootDiag.errors.push(
          (e && e.message ? e.message : 'Unknown error') +
            ' (' + (e && e.filename ? e.filename : '?') + ':' + (e && e.lineno ? e.lineno : '?') + ')'
        );
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason;
        window.__bootDiag.errors.push(
          'Unhandled promise rejection: ' + (reason && reason.message ? reason.message : String(reason))
        );
      });
      setTimeout(function () {
        if (window.__appBooted) return;
        var root = document.getElementById('root');
        if (!root) return;
        var msgs = window.__bootDiag.errors;
        var html =
          '<div style="min-height:100vh;background:#0F172A;color:#fff;font-family:ui-monospace,Menlo,monospace;' +
          'font-size:12px;padding:16px;box-sizing:border-box">' +
          '<div style="font-family:Manrope,sans-serif;font-size:16px;font-weight:800;margin-bottom:10px">' +
          'App failed to start</div>' +
          '<div style="font-family:Manrope,sans-serif;font-size:12.5px;color:#94A3B8;margin-bottom:14px;line-height:1.5">' +
          'Please screenshot this screen and send it back.</div>';
        if (msgs.length) {
          for (var i = 0; i < msgs.length; i++) {
            html +=
              '<div style="background:#1F242D;border-radius:10px;padding:12px;margin-bottom:8px;' +
              'white-space:pre-wrap;word-break:break-word">' +
              msgs[i].replace(/</g, '&lt;') +
              '</div>';
          }
        } else {
          html +=
            '<div style="background:#1F242D;border-radius:10px;padding:12px">No error was captured — ' +
            'the app script itself may not have loaded.</div>';
        }
        html += '</div>';
        root.innerHTML = html;
      }, 4000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
