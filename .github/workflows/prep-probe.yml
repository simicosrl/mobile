# Ask the Prep-Center's own endpoint what it actually answers.
#
# The container this repo is developed in cannot reach supabase.co, so there is
# no way to see the real responses from there. A GitHub runner can, and knowing
# the true status codes and bodies is the difference between guessing at the
# integration and writing it against what is really there.
#
# Read-only: it asks, it prints, it changes nothing. Run it from the Actions tab
# ("Run workflow"), optionally pasting the API key from the app's Settings › API
# so the probe sees what the phone sees.
name: Probe the Prep-Center API (debug tool)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Prep-Center base URL
        required: true
        default: https://muswtkzjfrldhgokkmqw.supabase.co/functions/v1/warehouse-scan-api
      api_key:
        description: API key from Settings › API (optional — leave empty to probe unauthenticated)
        required: false
      tracking:
        description: A tracking ID that really exists in the Prep-Center
        required: true
        default: <a tracking number>
  push:
    branches: [main]      # only with [prepprobe] in the commit message, below

# The result is committed back, so the run needs write access to the repo.
permissions:
  contents: write

jobs:
  probe:
    # On a push, only when the commit asks for it.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prepprobe]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the endpoint what it answers
        env:
          BASE: ${{ github.event.inputs.base_url || 'https://muswtkzjfrldhgokkmqw.supabase.co/functions/v1/warehouse-scan-api' }}
          # Prefer a repository secret so the key never appears in a log or in
          # run metadata; the dispatch input stays as a fallback.
          KEY: ${{ secrets.PREP_API_KEY || github.event.inputs.api_key }}
          TRACKING: ${{ github.event.inputs.tracking || '<a tracking number>' }}
        run: |
          set -u
          exec > >(tee prep-probe-result.txt) 2>&1
          BASE="${BASE%/}"

          # Show status, content-type and the first part of the body — enough to
          # tell "route does not exist" from "route exists but wants auth" from
          # "route answered and this is its shape", without dumping a payload
          # that might carry customer data into a public log.
          show() {
            local label="$1"; shift
            echo "───────────────────────────────────────────────"
            echo "== $label"
            echo "   $*" | sed "s/Bearer [^ ]*/Bearer <redacted>/g"
            local out
            out=$(curl -sS -m 25 -D /tmp/h -o /tmp/b -w '%{http_code}' "$@" 2>&1) || out="(request failed)"
            echo "   -> HTTP $out"
            grep -i '^content-type:' /tmp/h | head -1 | sed 's/^/   /' || true
            grep -i '^access-control-' /tmp/h | sed 's/^/   /' || true
            echo "   body (first 400 chars):"
            head -c 400 /tmp/b | sed 's/^/   | /'
            echo
            echo
          }

          AUTH=()
          if [ -n "${KEY:-}" ]; then
            AUTH=(-H "Authorization: Bearer ${KEY}")
            echo "Probing WITH the supplied key."
          else
            echo "Probing WITHOUT a key — 401 here just means the route wants auth."
          fi
          echo "Base: $BASE"
          echo

          show "GET (function root)" "$BASE" "${AUTH[@]}"

          show "OPTIONS /shipments/resolve (the CORS preflight the phone sends first)" \
            -X OPTIONS "$BASE/shipments/resolve" \
            -H 'Origin: https://localhost' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization, content-type'

          show "POST /shipments/resolve (what the app calls today)" \
            -X POST "$BASE/shipments/resolve" "${AUTH[@]}" \
            -H 'Content-Type: application/json' -H 'Origin: https://localhost' \
            -d "{\"trackings\":[\"$TRACKING\"]}"

          show "POST /definitely-not-a-real-route-xyz (control: what an unknown route looks like)" \
            -X POST "$BASE/definitely-not-a-real-route-xyz" "${AUTH[@]}" \
            -H 'Content-Type: application/json' -H 'Origin: https://localhost' -d '{}'

          # Their 404 body and CORS headers have the same shape as our own
          # wms-api, which suggests this function was built to the same contract
          # — the one in docs/WMS-App-API-Integration-Guide.pdf, which the app's
          # Prep-Center push already talks. If so, its real surface is these.
          #
          # GET only, deliberately. A POST to /warehouse/sessions would create a
          # document in someone's live system; discovering a route is never worth
          # writing data to find out.
          echo
          echo "###############################################################"
          echo "# Does this function speak the app's own protocol?"
          echo "###############################################################"
          echo

          for p in "/warehouse/manifest?date=today" /warehouse/drivers /warehouse/carriers "/warehouse/sessions?days=1"; do
            show "GET $p" "$BASE$p" "${AUTH[@]}" -H 'Origin: https://localhost'
          done
          show "GET /admin/badge-country/BADGE-IONUT" "$BASE/admin/badge-country/BADGE-IONUT" "${AUTH[@]}" -H 'Origin: https://localhost'

          # Anything that might simply list what exists.
          for p in /health /status /routes /openapi.json /api /v1; do
            show "GET $p" "$BASE$p" "${AUTH[@]}" -H 'Origin: https://localhost'
          done

          echo
          echo "###############################################################"
          echo "# Does the manifest know the tracking from the warehouse report?"
          echo "###############################################################"
          echo
          # The manifest is a list of real customer tracking IDs, so this counts
          # and answers rather than printing it into a file that gets committed.
          # The question is narrow: does the Prep-Center know this label at all.
          for d in today $(date -u +%F) $(date -u -d yesterday +%F) $(date -u -d '2 days ago' +%F); do
            curl -sS -m 25 -o /tmp/m "$BASE/warehouse/manifest?date=$d" "${AUTH[@]}" -H 'Origin: https://localhost' || true
            python3 -c 'import json,sys;d=sys.argv[1];t=sys.argv[2];ids=(json.load(open("/tmp/m")).get("tracking_ids") or []);near=[x for x in ids if x[:6]==t[:6]];print("   %-12s %5d tracking ids   |   %s present: %s%s" % (d, len(ids), t, "YES" if t in ids else "no", "   (%d share its first 6 chars)" % len(near) if near and t not in ids else ""))' "$d" "$TRACKING" || echo "   $d: could not read the manifest"
          done

          echo "───────────────────────────────────────────────"
          echo "Read the statuses: 404 = no such route, 401 = route wants a key,"
          echo "200 with a shipments list = the route we need already exists."

      # The run log cannot be downloaded from the environment this repo is
      # developed in, so the result comes back through the repo instead —
      # the same way db-check reports.
      - name: Commit the result back
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f prep-probe-result.txt
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "ci: prep-center probe result [skip dbcheck]"
          cp prep-probe-result.txt /tmp/prep-probe-result.txt
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/prep-probe-result.txt prep-probe-result.txt
            git add -f prep-probe-result.txt
            git commit -m "ci: prep-center probe result [skip dbcheck]"
            sleep $((i * 3))
          done
          echo "Giving up after 5 attempts" >&2
          exit 1
