name: One-off DB check (debug tool)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    if: contains(github.event.head_commit.message, '[dbcheck]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Query database
        env:
          DB_PASS: "HDOT8GxPoyn70PWs"
          PROJECT_REF: "piafchajbkfkyftumxke"
        run: |
          set +e
          {
            echo "== candidate pooler hosts, probing each =="
          } > db-check-result.txt
          CONN=""
          for region in eu-west-1 eu-west-2 eu-west-3 eu-central-1 eu-north-1 us-east-1 us-east-2 us-west-1 us-west-2 ap-southeast-1 ap-southeast-2 ap-northeast-1 ap-south-1 sa-east-1 ca-central-1; do
            for slot in 0 1 2; do
              HOST="aws-${slot}-${region}.pooler.supabase.com"
              CANDIDATE="postgresql://postgres.${PROJECT_REF}:${DB_PASS}@${HOST}:5432/postgres?connect_timeout=5"
              OUT=$(psql "$CANDIDATE" -c "select 1;" -t 2>&1)
              STATUS=$?
              echo "-- ${HOST}: exit ${STATUS} --" >> db-check-result.txt
              if [ $STATUS -eq 0 ]; then
                echo "FOUND WORKING HOST: ${HOST}" >> db-check-result.txt
                CONN="$CANDIDATE"
                break 2
              fi
              # Stop probing slots for a region once we get a definitive
              # "tenant/user not found" (means host resolves fine, wrong
              # tenant — no point trying other slot numbers for it) vs a
              # DNS/unreachable error (try other slots, host might differ).
              if echo "$OUT" | grep -q "not found"; then
                break
              fi
            done
          done
          if [ -z "$CONN" ]; then
            echo "No working pooler host found among candidates." >> db-check-result.txt
            exit 0
          fi
          {
            echo
            echo "== connection actually used below =="
            echo "$CONN" | sed -E 's#(://[^:]+:)[^@]+#\1<redacted>#'
            echo
            echo "== admin.scanner_keys =="
            psql "$CONN" -c "select * from admin.scanner_keys order by country;"
            echo
            echo "== wh_it.sessions (last 10) =="
            psql "$CONN" -x -c "select * from wh_it.sessions order by 1 desc limit 10;"
            echo
            echo "== wh_it.parcels, any row with tracking code containing 8007404018060 =="
            psql "$CONN" -x -c "select * from wh_it.parcels where tracking_code::text like '%8007404018060%';"
            echo
            echo "== wh_it.parcels (last 10, any code) =="
            psql "$CONN" -x -c "select * from wh_it.parcels order by 1 desc limit 10;"
            echo
            echo "== row counts per country schema =="
            psql "$CONN" -c "select 'it' as country, (select count(*) from wh_it.sessions) as sessions, (select count(*) from wh_it.parcels) as parcels;"
            psql "$CONN" -c "select 'fr' as country, (select count(*) from wh_fr.sessions) as sessions, (select count(*) from wh_fr.parcels) as parcels;"
            psql "$CONN" -c "select 'de' as country, (select count(*) from wh_de.sessions) as sessions, (select count(*) from wh_de.parcels) as parcels;"
          } >> db-check-result.txt 2>&1
          cat db-check-result.txt

      - name: Commit result back to repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f db-check-result.txt
          if git diff --cached --quiet; then
            echo "Nothing changed"
          else
            git commit -m "ci: db-check result [skip dbcheck]"
            git push origin HEAD:main
          fi
