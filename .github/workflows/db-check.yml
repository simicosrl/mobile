name: One-off DB check (debug tool)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    if: contains(github.event.head_commit.message, '[dbcheck]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply pending SQL migrations
        env:
          CONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== applying $f =="
            psql "$CONN" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Deploy the edge function (CORS fix + doc reservation + drivers)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN repo secret is not set — skipping deploy." >&2
            exit 1
          fi
          npm install -g supabase
          supabase functions deploy wms-api --project-ref piafchajbkfkyftumxke --no-verify-jwt

      - name: Test the deployed edge function directly (bypassing the app entirely)
        env:
          IT_KEY: "whs_ab0c2b8f5ee0ec80f413ceb86820af732db6ebe051b8a213"
        run: |
          {
            echo "== OPTIONS preflight (what the WebView sends before the real POST) =="
            curl -sS -i -m 20 -X OPTIONS \
              "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/sessions" \
              -H "Origin: https://localhost" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: authorization,content-type"
            echo
            echo
            echo "== GET /warehouse/manifest with the Italy default key =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/manifest?date=today" \
              -H "Origin: https://localhost" \
              -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== POST /warehouse/next-doc-number (inbound) =="
            curl -sS -i -m 20 -X POST "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/next-doc-number" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}" -H "Content-Type: application/json" \
              -d '{"direction":"inbound"}'
            echo
            echo
            echo "== POST /warehouse/drivers (upsert a CI-PROBE test driver) =="
            curl -sS -i -m 20 -X POST "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/drivers" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}" -H "Content-Type: application/json" \
              -d '{"name":"CI-PROBE Driver","courierCompany":"CI Test Co","plate":"CI-000-CI"}'
            echo
            echo
            echo "== GET /warehouse/drivers =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/drivers" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== GET /admin/badge-country/BADGE-IONUT (expect 200, IT) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/admin/badge-country/BADGE-IONUT" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== GET /warehouse/carriers (expect the seeded IT list) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/carriers" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== GET /warehouse/sessions?days=30 (shared cross-device history) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/sessions?days=30" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== GET /admin/badge-country/BADGE-ADRIAN (expect 200, FR) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/admin/badge-country/BADGE-ADRIAN" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== GET /admin/badge-country/BADGE-IONUT (expect a label field now too) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/admin/badge-country/BADGE-IONUT" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== POST /admin/login-event (CI-PROBE) =="
            curl -sS -i -m 20 -X POST "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/admin/login-event" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}" -H "Content-Type: application/json" \
              -d '{"badgeId":"CI-PROBE-BADGE","operatorName":"CI Probe","country":"IT"}'
            echo
            echo
            echo "== GET /admin/login-events?limit=5 (expect the CI-PROBE row on top with a real IP) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/admin/login-events?limit=5" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== GET /admin/badge-country/BADGE-AMELIE (expect 200, FR) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/admin/badge-country/BADGE-AMELIE" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
            echo
            echo "== GET /admin/badge-country/BADGE-DOES-NOT-EXIST (expect 404) =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/admin/badge-country/BADGE-DOES-NOT-EXIST" \
              -H "Origin: https://localhost" -H "Authorization: Bearer ${IT_KEY}"
            echo
          } > edge-function-probe.txt 2>&1
          cat edge-function-probe.txt

      - name: Query database
        env:
          CONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          {
            echo
            echo "== connection actually used below =="
            echo "$CONN" | sed -E 's#(://[^:]+:)[^@]+#\1<redacted>#'
            echo
            echo "== admin.scanner_keys =="
            psql "$CONN" -c "select * from admin.scanner_keys order by country;"
            echo
            echo "== wh_it.sessions (last 10) =="
            psql "$CONN" -x -c "select * from wh_it.sessions order by 1 desc limit 10;"
            echo
            echo "== wh_it.parcels, any row with tracking code containing 8007404018060 =="
            psql "$CONN" -x -c "select * from wh_it.parcels where tracking::text like '%8007404018060%';"
            echo
            echo "== wh_it.parcels (last 10, any code) =="
            psql "$CONN" -x -c "select * from wh_it.parcels order by 1 desc limit 10;"
            echo
            echo "== row counts per country schema =="
            psql "$CONN" -c "select 'it' as country, (select count(*) from wh_it.sessions) as sessions, (select count(*) from wh_it.parcels) as parcels;"
            psql "$CONN" -c "select 'fr' as country, (select count(*) from wh_fr.sessions) as sessions, (select count(*) from wh_fr.parcels) as parcels;"
            psql "$CONN" -c "select 'de' as country, (select count(*) from wh_de.sessions) as sessions, (select count(*) from wh_de.parcels) as parcels;"
          } > db-check-result.txt 2>&1
          cat db-check-result.txt

      - name: Clean up CI probe test data
        env:
          CONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          {
            echo
            echo "== sequences owned by schema admin (for doc numbering) =="
            psql "$CONN" -c "select sequencename from pg_sequences where schemaname = 'admin';"
            echo
            echo "== deleting CI-PROBE test rows from wh_it =="
            psql "$CONN" -c "delete from wh_it.parcels where session_id in (select id from wh_it.sessions where carrier like 'CI-PROBE%');"
            psql "$CONN" -c "delete from wh_it.sessions where carrier like 'CI-PROBE%';"
            psql "$CONN" -c "delete from wh_it.driver_profiles where name like 'CI-PROBE%';"
            psql "$CONN" -c "delete from admin.login_events where badge_id = 'CI-PROBE-BADGE';"
            echo
            echo "== resetting IT/inbound doc sequence back to 0 (only test docs existed) =="
            psql "$CONN" -c "select setval(s.sequencename::regclass, 0, false) from pg_sequences s where s.schemaname = 'admin' and s.sequencename ilike '%it%in%';"
            echo
            echo "== wh_it state after cleanup =="
            psql "$CONN" -c "select count(*) as sessions from wh_it.sessions;"
            psql "$CONN" -c "select count(*) as parcels from wh_it.parcels;"
          } >> db-check-result.txt 2>&1
          cat db-check-result.txt

      - name: Commit result back to repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f db-check-result.txt edge-function-probe.txt
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "ci: db-check result [skip dbcheck]"
          # The APK-build workflow runs on the same push and also commits
          # back to main — retry instead of failing outright on the
          # resulting non-fast-forward race.
          #
          # NOTE: this used to retry with `git rebase origin/main`, which
          # can deadlock the same way it did in build-apk.yml — these two
          # files are wholly regenerated every run, so if another db-check
          # run landed first, rebasing has to replay our version over
          # theirs with no real 3-way merge to do, and can end up an
          # unresolvable conflict. There's nothing to actually merge here
          # either — just reset onto the new tip and recreate the same
          # commit there, using copies saved before the reset (a hard reset
          # would otherwise blow away our freshly-written files and restore
          # whatever this tracked path last held on the previous tip).
          cp db-check-result.txt /tmp/db-check-result.txt
          cp edge-function-probe.txt /tmp/edge-function-probe.txt
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/db-check-result.txt db-check-result.txt
            cp /tmp/edge-function-probe.txt edge-function-probe.txt
            git add -f db-check-result.txt edge-function-probe.txt
            git commit -m "ci: db-check result [skip dbcheck]"
            sleep $((i * 3))
          done
          echo "Giving up after 5 attempts" >&2
          exit 1
