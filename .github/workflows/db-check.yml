name: One-off DB check (debug tool)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    if: contains(github.event.head_commit.message, '[dbcheck]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Test the deployed edge function directly (bypassing the app entirely)
        env:
          IT_KEY: "whs_ab0c2b8f5ee0ec80f413ceb86820af732db6ebe051b8a213"
        run: |
          {
            echo "== POST /warehouse/sessions with the Italy default key =="
            curl -sS -i -m 20 -X POST \
              "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/sessions" \
              -H "Authorization: Bearer ${IT_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"direction":"inbound","carrier":"CI-PROBE","operator":"ci-probe","closed_at":"2026-08-24T00:00:00.000Z","parcels":[{"tracking":"CIPROBE-8007404018060","boxes":1}]}'
            echo
            echo
            echo "== GET /warehouse/manifest with the Italy default key =="
            curl -sS -i -m 20 "https://piafchajbkfkyftumxke.supabase.co/functions/v1/wms-api/warehouse/manifest?date=today" \
              -H "Authorization: Bearer ${IT_KEY}"
            echo
          } > edge-function-probe.txt 2>&1
          cat edge-function-probe.txt

      - name: Query database
        env:
          CONN: "postgresql://postgres.piafchajbkfkyftumxke:b96CYVJYG1tVV5nF@aws-1-eu-west-1.pooler.supabase.com:6543/postgres"
        run: |
          set +e
          {
            echo
            echo "== connection actually used below =="
            echo "$CONN" | sed -E 's#(://[^:]+:)[^@]+#\1<redacted>#'
            echo
            echo "== admin.scanner_keys =="
            psql "$CONN" -c "select * from admin.scanner_keys order by country;"
            echo
            echo "== wh_it.sessions (last 10) =="
            psql "$CONN" -x -c "select * from wh_it.sessions order by 1 desc limit 10;"
            echo
            echo "== wh_it.parcels, any row with tracking code containing 8007404018060 =="
            psql "$CONN" -x -c "select * from wh_it.parcels where tracking::text like '%8007404018060%';"
            echo
            echo "== wh_it.parcels (last 10, any code) =="
            psql "$CONN" -x -c "select * from wh_it.parcels order by 1 desc limit 10;"
            echo
            echo "== row counts per country schema =="
            psql "$CONN" -c "select 'it' as country, (select count(*) from wh_it.sessions) as sessions, (select count(*) from wh_it.parcels) as parcels;"
            psql "$CONN" -c "select 'fr' as country, (select count(*) from wh_fr.sessions) as sessions, (select count(*) from wh_fr.parcels) as parcels;"
            psql "$CONN" -c "select 'de' as country, (select count(*) from wh_de.sessions) as sessions, (select count(*) from wh_de.parcels) as parcels;"
          } > db-check-result.txt 2>&1
          cat db-check-result.txt

      - name: Commit result back to repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f db-check-result.txt edge-function-probe.txt
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "ci: db-check result [skip dbcheck]"
          # The APK-build workflow runs on the same push and also commits
          # back to main — retry with rebase instead of failing outright
          # on the resulting non-fast-forward race.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((i * 3))
          done
          echo "Giving up after 5 attempts" >&2
          exit 1
