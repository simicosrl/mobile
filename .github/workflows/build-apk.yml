name: Build debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'WMS-App-debug.apk'
      - 'version.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install matching Android SDK platform/build-tools
        run: |
          set -e
          COMPILE_SDK=$(grep -oE 'compileSdkVersion = [0-9]+' android/variables.gradle | grep -oE '[0-9]+')
          echo "compileSdkVersion = $COMPILE_SDK"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-${COMPILE_SDK}"
          LATEST_BUILD_TOOLS=$(sdkmanager --list 2>/dev/null | grep -oE 'build-tools;[0-9]+\.[0-9]+\.[0-9]+' | sort -t';' -k2 -V | tail -1)
          echo "Installing $LATEST_BUILD_TOOLS"
          sdkmanager "$LATEST_BUILD_TOOLS"

      - name: Install JS deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          file "$APK"
          ls -la "$APK"
          cp "$APK" WMS-App-debug.apk

      - name: Write version manifest (for the in-app update check)
        run: |
          cat > version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://raw.githubusercontent.com/simicosrl/mobile/main/WMS-App-debug.apk",
            "commit": "${{ github.sha }}"
          }
          EOF
          cat version.json

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WMS-App-debug
          path: WMS-App-debug.apk
          retention-days: 90

      - name: Commit APK + version manifest back to the repo
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f WMS-App-debug.apk version.json
          git rm -f --ignore-unmatch SIMICO-Warehouse-Scan-debug.apk
          if git diff --cached --quiet; then
            echo "Nothing changed, nothing to commit"
            exit 0
          fi
          git commit -m "ci: update compiled debug APK (v1.0.${{ github.run_number }})" -m "Built from ${{ github.sha }} by GitHub Actions. Debug-signed with the project's pinned debug key — fine for sideloading, not for Play Store."
          # This workflow and the db-check one can both land a commit on the
          # same push (or two builds can overlap during a burst of pushes) —
          # without a retry, whichever finishes second gets a non-fast-forward
          # rejection and its APK is silently lost, which is exactly what was
          # happening here.
          #
          # NOTE: this used to retry with `git rebase origin/main`, which
          # reliably deadlocks — WMS-App-debug.apk and version.json are the
          # *only* two files this commit ever touches, and they're also the
          # only two files any other run of this same workflow ever touches,
          # so a rebase always has to replay a change to a binary APK and a
          # JSON file that the new tip already changed differently. Git can't
          # 3-way merge either, so it lands as an unresolvable conflict and
          # the whole job dies (confirmed by a real failed run). There is
          # nothing to actually merge, though — these are pure build
          # artifacts, not hand-edited content — so instead: reset straight
          # onto the new tip and recreate the exact same commit there, from
          # the APK gradle already built (untouched by reset --hard, since
          # android/*/build/ is gitignored).
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git reset --hard origin/main
            cp android/app/build/outputs/apk/debug/app-debug.apk WMS-App-debug.apk
            cat > version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://raw.githubusercontent.com/simicosrl/mobile/main/WMS-App-debug.apk",
            "commit": "${{ github.sha }}"
          }
          EOF
            git add -f WMS-App-debug.apk version.json
            git commit -m "ci: update compiled debug APK (v1.0.${{ github.run_number }})" -m "Built from ${{ github.sha }} by GitHub Actions. Debug-signed with the project's pinned debug key — fine for sideloading, not for Play Store."
            sleep $((i * 5))
          done
          echo "Giving up after 5 attempts" >&2
          exit 1
